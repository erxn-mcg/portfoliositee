<body class="font-sans bg-white text-[#1a1a1a]">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const RED   = '#f60030';
    const DARK  = '#3b0918';
    const BEIGE = '#fff3d9';

    // ── Scroll Reveal ──────────────────────────────────────────
    const SR = ({ children, delay = 0, className = '' }) => {
      const ref = useRef(null);
      const [v, setV] = useState(false);
      useEffect(() => {
        const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setTimeout(() => setV(true), delay); }, { threshold: 0.06 });
        if (ref.current) o.observe(ref.current);
        return () => o.disconnect();
      }, [delay]);
      return <div ref={ref} className={`transition-all duration-700 ease-out ${v ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-6'} ${className}`}>{children}</div>;
    };

    // ── Animated Counter ───────────────────────────────────────
    const Count = ({ end, suffix = '' }) => {
      const [n, setN] = useState(0);
      const ref = useRef(null);
      const [v, setV] = useState(false);
      useEffect(() => {
        const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold: 0.1 });
        if (ref.current) o.observe(ref.current);
        return () => o.disconnect();
      }, []);
      useEffect(() => {
        if (!v) return;
        let s = 0;
        const t = setInterval(() => { s += Math.ceil(end / 50); if (s >= end) { setN(end); clearInterval(t); } else setN(s); }, 28);
        return () => clearInterval(t);
      }, [v, end]);
      return <span ref={ref}>{n.toLocaleString()}{suffix}</span>;
    };

    // ── Navigation ─────────────────────────────────────────────
    const Nav = ({ page, go }) => {
      const [open, setOpen] = useState(false);
      const [about, setAbout] = useState(false);
      const [scrolled, setScrolled] = useState(false);
      const aboutRef = useRef(null);

      useEffect(() => {
        const s = () => setScrolled(window.scrollY > 30);
        window.addEventListener('scroll', s);
        return () => window.removeEventListener('scroll', s);
      }, []);

      useEffect(() => {
        const handler = (e) => { if (aboutRef.current && !aboutRef.current.contains(e.target)) setAbout(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const navGo = (p) => { go(p); setOpen(false); setAbout(false); };

      const linkCls = (id) =>
        `text-xs uppercase tracking-widest transition-colors duration-200 ${page === id ? 'text-[#f60030]' : 'text-[#1a1a1a]/50 hover:text-[#1a1a1a]'}`;

      return (
        <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-400 ${scrolled ? 'bg-white/95 backdrop-blur-md shadow-sm' : 'bg-transparent'}`}>
          <div className="max-w-7xl mx-auto px-8 h-16 flex items-center justify-between">

            {/* Logo */}
            <button onClick={() => navGo('home')} className="font-serif text-lg font-medium text-[#3b0918] hover:text-[#f60030] transition-colors">
              erinmerylstudy
            </button>

            {/* Desktop links */}
            <div className="hidden md:flex items-center gap-10">

              {/* About Erin dropdown */}
              <div ref={aboutRef} className="relative">
                <button
                  onClick={() => setAbout(!about)}
                  onMouseEnter={() => setAbout(true)}
                  className={`${linkCls('about')} flex items-center gap-1`}
                >
                  About Erin
                  <svg className={`w-3 h-3 transition-transform ${about ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/></svg>
                </button>
                {about && (
                  <div onMouseLeave={() => setAbout(false)} className="dropdown-enter absolute top-full left-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-black/5 py-1 z-50">
                    {[['about','About'],['cv','CV'],['built',"Stuff I'm Building"]].map(([id,label]) => (
                      <button key={id} onClick={() => navGo(id)}
                        className="block w-full text-left px-4 py-2.5 text-sm text-[#1a1a1a]/70 hover:text-[#f60030] hover:bg-[#fff3d9] transition-colors">
                        {label}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <button onClick={() => navGo('community')} className={linkCls('community')}>Locked In</button>
              <button onClick={() => navGo('contact')} className={linkCls('contact')}>Contact</button>
            </div>

            {/* Mobile hamburger */}
            <button onClick={() => setOpen(!open)} className="md:hidden w-8 h-8 flex items-center justify-center text-[#1a1a1a]">
              {open ? '✕' : '☰'}
            </button>
          </div>

          {/* Mobile menu */}
          {open && (
            <div className="md:hidden bg-white border-t border-black/5 py-4 animate-fadeIn">
              {[['about','About'],['cv','CV'],['built',"Stuff I'm Building"],['community','Locked In'],['opportunities','Opportunities'],['contact','Contact']].map(([id,label]) => (
                <button key={id} onClick={() => navGo(id)}
                  className={`block w-full text-left px-8 py-3 text-sm ${page === id ? 'text-[#f60030]' : 'text-[#1a1a1a]/60'}`}>
                  {label}
                </button>
              ))}
            </div>
          )}
        </nav>
      );
    };

    // ── HOME ───────────────────────────────────────────────────
    const Home = ({ go }) => (
      <div className="bg-white">

        {/* Hero */}
        <section className="min-h-screen pt-16 px-8 md:px-16 flex items-center">
          <div className="max-w-7xl mx-auto w-full grid md:grid-cols-5 gap-8 md:gap-16 items-center py-20">

            {/* Left — text */}
            <div className="md:col-span-3">
              <SR>
                <div className="flex flex-wrap gap-2 mb-10">
                  {['Cambridge Student','Content Creator','Community Builder'].map(t => (
                    <span key={t} className="text-xs px-3 py-1.5 border border-[#3b0918]/15 text-[#3b0918]/50 rounded-full">{t}</span>
                  ))}
                </div>
              </SR>
              <SR delay={100}>
                <h1 className="font-serif text-5xl md:text-6xl lg:text-7xl text-[#3b0918] leading-[1.04] mb-8">
                  Making learning<br />as <em className="italic text-[#f60030]">addictive</em><br />as social media
                </h1>
              </SR>
              <SR delay={200}>
                <p className="text-[#5a5a5a] text-base leading-relaxed mb-10 max-w-lg">
                  I create content, build community and make tools that help students fall back in love with learning.
                </p>
              </SR>
              <SR delay={300}>
                <div className="flex flex-wrap gap-3">
                  <button onClick={() => go('community')} className="px-7 py-3.5 bg-[#f60030] text-white rounded-full text-sm hover:bg-[#3b0918] transition-colors duration-300">
                    Join Locked In →
                  </button>
                  <button onClick={() => go('about')} className="px-7 py-3.5 border border-[#1a1a1a]/15 text-[#1a1a1a] rounded-full text-sm hover:border-[#1a1a1a]/40 transition-colors duration-300">
                    About Me
                  </button>
                </div>
              </SR>
            </div>

            {/* Right — photo + stat cards */}
            <div className="md:col-span-2">
              <SR delay={150}>
                <div className="relative">
                  {/* Beige backdrop block */}
                  <div className="absolute -top-4 -right-4 w-full h-full bg-[#fff3d9] rounded-3xl"></div>
                  {/* Red accent dot */}
                  <div className="absolute -bottom-3 -left-3 w-12 h-12 bg-[#f60030] rounded-full z-10"></div>
                  {/* Photo */}
                  <div className="relative rounded-3xl overflow-hidden aspect-[3/4] shadow-lg">
                    <img src="profile.png" alt="Erin Meryl McGurk" className="w-full h-full object-cover" />
                  </div>
                  {/* Floating stat pill */}
                  <div className="absolute -bottom-5 right-6 bg-white shadow-lg rounded-2xl px-5 py-3 z-20">
                    <p className="font-serif text-2xl text-[#f60030]">400K+</p>
                    <p className="text-xs text-[#5a5a5a]">Student community</p>
                  </div>
                </div>
              </SR>
            </div>
          </div>
        </section>

        {/* Marquee strip */}
        <div className="bg-[#fff3d9] border-y border-[#3b0918]/8 py-4 overflow-hidden">
          <div className="flex animate-marquee whitespace-nowrap">
            {[
              '400K+ Followers','·','100M+ Lives Touched','·','30+ Brand Collaborations','·','15+ Speaking Events','·',
              'Samsung','·','Google Gemini','·','OpenAI','·','Loop Earplugs','·','BackMarket','·',
              'ITV','·','BBC Manchester','·','The Heard','·',
              '400K+ Followers','·','100M+ Lives Touched','·','30+ Brand Collaborations','·','15+ Speaking Events','·',
              'Samsung','·','Google Gemini','·','OpenAI','·','Loop Earplugs','·','BackMarket','·',
              'ITV','·','BBC Manchester','·','The Heard','·',
            ].map((t, i) => (
              <span key={i} className={`mx-4 text-sm ${t === '·' ? 'text-[#f60030]' : 'text-[#3b0918]/60 font-medium'}`}>{t}</span>
            ))}
          </div>
        </div>

        {/* Three destination cards */}
        <section className="py-20 px-8 md:px-16 bg-white">
          <div className="max-w-7xl mx-auto grid md:grid-cols-3 gap-6">
            {[
              {
                tag: 'Community',
                title: 'Locked In',
                desc: "My community for ambitious students who want more from their learning and their lives.",
                page: 'community',
                bg: DARK,
                text: '#fff3d9',
              },
              {
                tag: "Building",
                title: "Stuff I'm Building",
                desc: "Tools, platforms and resources I've created — from free websites to study resources.",
                page: 'built',
                bg: BEIGE,
                text: DARK,
              },
              {
                tag: 'For Students',
                title: 'Opportunities',
                desc: 'Curated scholarships, internships, competitions and events worth applying for.',
                page: 'opportunities',
                bg: '#f60030',
                text: '#fff',
              },
            ].map((item, i) => (
              <SR key={i} delay={i * 80}>
                <button onClick={() => go(item.page)}
                  className="group w-full text-left rounded-3xl p-8 md:p-10 h-full flex flex-col justify-between min-h-[260px] hover:scale-[1.02] transition-transform duration-300"
                  style={{ backgroundColor: item.bg, color: item.text }}>
                  <div>
                    <span className="text-xs uppercase tracking-widest opacity-50 mb-5 block">{item.tag}</span>
                    <h3 className="font-serif text-2xl md:text-3xl mb-3">{item.title}</h3>
                    <p className="text-sm leading-relaxed opacity-65">{item.desc}</p>
                  </div>
                  <span className="text-sm mt-6 opacity-75 group-hover:opacity-100 transition-opacity">Explore →</span>
                </button>
              </SR>
            ))}
          </div>
        </section>
      </div>
    );

    // ── ABOUT ──────────────────────────────────────────────────
    const About = () => (
      <div className="bg-white pt-16">

        {/* Big header band */}
        <div className="bg-[#fff3d9] px-8 md:px-16 py-16 md:py-24">
          <div className="max-w-7xl mx-auto grid md:grid-cols-2 gap-10 items-end">
            <SR>
              <p className="text-xs uppercase tracking-widest text-[#f60030] mb-4">About Me</p>
              <h1 className="font-serif text-5xl md:text-7xl text-[#3b0918] leading-tight">
                Hi,<br />I'm Erin.
              </h1>
            </SR>
            <SR delay={100}>
              <p className="text-lg text-[#3b0918]/60 leading-relaxed font-serif italic max-w-md">
                "Cambridge student, content creator, and community builder — making learning addictive since 2024."
              </p>
            </SR>
          </div>
        </div>

        {/* Bio + photo */}
        <section className="px-8 md:px-16 py-20">
          <div className="max-w-7xl mx-auto grid md:grid-cols-5 gap-12 items-start">

            <div className="md:col-span-2">
              <SR>
                <div className="rounded-3xl overflow-hidden aspect-[4/5] shadow-md">
                  <img src="profile.png" alt="Erin" className="w-full h-full object-cover" />
                </div>
                <div className="mt-6 space-y-0">
                  {[
                    ['Location','Cambridge, UK'],
                    ['Course','Land Economy'],
                    ['College',"St John's, Cambridge"],
                    ['Year','2nd year undergraduate'],
                  ].map(([l, v]) => (
                    <div key={l} className="flex gap-4 text-sm py-3 border-b border-black/5">
                      <span className="text-black/30 w-20 shrink-0 text-xs uppercase tracking-wide">{l}</span>
                      <span className="text-[#1a1a1a]">{v}</span>
                    </div>
                  ))}
                </div>
              </SR>
            </div>

            <div className="md:col-span-3 space-y-8">
              <SR delay={80}>
                <div className="space-y-5 text-[#5a5a5a] text-sm leading-relaxed">
                  <p>
                    I'm a second year student at <strong className="text-[#3b0918]">St John's College, Cambridge</strong>, studying Land Economy — a mix of law, economics and public policy.
                  </p>
                  <p>
                    I started making content in August 2024 and grew a community of <strong className="text-[#3b0918]">400K+ students</strong> in under a year. What started as study tips became something much bigger — a genuine conversation about how people learn, why curiosity matters, and how to stay motivated in a world built to distract you.
                  </p>
                  <p>
                    My mission: <em className="text-[#3b0918] font-serif italic text-base">to help people fall back in love with learning</em>. Everything I make — from content and community to the tools I build — comes back to that.
                  </p>
                </div>
              </SR>

              {/* Fun facts */}
              <SR delay={160}>
                <p className="text-xs uppercase tracking-widest text-black/30 mb-5">Beyond the Content</p>
                <div className="grid grid-cols-2 gap-3">
                  {[
                    { e: '🏃', t: 'Training for a 100km race in the Chilterns' },
                    { e: '☕', t: 'Chai latte + brunch — every week, non-negotiable' },
                    { e: '🚀', t: 'Research: Space Governance and satellite AI alignment' },
                    { e: '🎓', t: 'Formal dinner at every Cambridge college. 7/31' },
                  ].map((x, i) => (
                    <div key={i} className="bg-[#fff3d9] rounded-2xl p-5 flex gap-3 items-start">
                      <span className="text-xl shrink-0">{x.e}</span>
                      <p className="text-xs text-[#5a5a5a] leading-relaxed">{x.t}</p>
                    </div>
                  ))}
                </div>
              </SR>
            </div>
          </div>
        </section>

        {/* Experience — alternating row cards */}
        <section className="px-8 md:px-16 pb-20">
          <div className="max-w-7xl mx-auto">
            <SR>
              <div className="flex items-baseline gap-6 mb-10">
                <h2 className="font-serif text-3xl text-[#3b0918]">Experience</h2>
                <div className="flex-1 border-t border-black/8 mt-2"></div>
              </div>
            </SR>
            <div className="space-y-4">
              {[
                { y: 'Aug 2024 – Present', t: 'Content Creator & Study Coach', o: 'erinmerylstudy', d: '400K+ students across platforms sharing neuroscience-backed study strategies. 30+ brand collaborations. 15+ speaking events. Featured by ITV, BBC Manchester and The Heard.' },
                { y: 'Oct 2024 – Present', t: 'Undergraduate Student', o: "St John's College, University of Cambridge", d: 'Studying Land Economy. Co-founder of the French Rock Society and involved in college and university outreach programmes.' },
                { y: 'Dec 2025 – Present', t: 'Grantee', o: 'Cosmos Institute', d: 'Awarded funding to build a platform teaching effective and responsible AI use to students. Research focus: Space Governance and the alignment of satellite-based AI systems.' },
                { y: '2025 – Present', t: 'Marketing Consultant', o: 'em²', d: 'Strategic consultancy helping organisations — from startups to the University of Cambridge — connect authentically with student audiences.' },
              ].map((item, i) => (
                <SR key={i} delay={i * 60}>
                  <div className={`grid md:grid-cols-4 gap-6 p-7 rounded-2xl ${i % 2 === 0 ? 'bg-white border border-black/6' : 'bg-[#fff3d9]'}`}>
                    <div>
                      <span className="text-xs text-[#f60030] font-medium">{item.y}</span>
                    </div>
                    <div className="md:col-span-3">
                      <h3 className="font-serif text-lg text-[#3b0918] mb-0.5">{item.t}</h3>
                      <p className="text-xs text-[#5a5a5a] font-medium mb-2">{item.o}</p>
                      <p className="text-sm text-[#5a5a5a] leading-relaxed">{item.d}</p>
                    </div>
                  </div>
                </SR>
              ))}
            </div>
          </div>
        </section>
      </div>
    );

    // ── LOCKED IN (Community) ──────────────────────────────────
    const STAN = 'https://stan.store/erinmerylstudy/p/locked-in-with-erinmerylstudy';

    const Community = () => (
      <div className="bg-white pt-16">

        {/* Full-bleed dark hero */}
        <div className="bg-[#3b0918] min-h-screen flex items-center px-8 md:px-16 py-24">
          <div className="max-w-7xl mx-auto w-full grid md:grid-cols-2 gap-16 items-center">
            <SR>
              <p className="text-xs uppercase tracking-widest text-[#f60030] mb-8">Community</p>
              <h1 className="font-serif text-7xl md:text-9xl text-[#fff3d9] leading-none mb-8">
                Locked<br /><em className="italic text-[#f60030]">In.</em>
              </h1>
              <a href={STAN} target="_blank" rel="noopener noreferrer"
                className="inline-block px-8 py-4 bg-[#f60030] text-white rounded-full text-sm hover:bg-white hover:text-[#f60030] transition-colors duration-300">
                Join Now →
              </a>
            </SR>
            <SR delay={150}>
              <p className="font-serif text-2xl md:text-3xl text-[#fff3d9]/60 leading-relaxed italic">
                "A community for ambitious students who want to take their learning — and their lives — seriously."
              </p>
              <div className="mt-12 space-y-4">
                {["Students who want to understand, not just pass", "Anyone who has fallen out of love with studying", "People who are serious about building something with their life"].map((s, i) => (
                  <div key={i} className="flex gap-3 items-start">
                    <span className="text-[#f60030] shrink-0 mt-0.5 text-lg">—</span>
                    <p className="text-sm text-[#fff3d9]/60 leading-relaxed">{s}</p>
                  </div>
                ))}
              </div>
            </SR>
          </div>
        </div>

        {/* What you get — white section */}
        <section className="px-8 md:px-16 py-20 bg-white">
          <div className="max-w-7xl mx-auto">
            <SR>
              <div className="flex items-baseline gap-6 mb-12">
                <h2 className="font-serif text-3xl text-[#3b0918]">What you get</h2>
                <div className="flex-1 border-t border-black/8"></div>
              </div>
            </SR>
            <div className="grid md:grid-cols-4 gap-5">
              {[
                { icon: '📚', t: 'Study Resources', d: 'Neuroscience-backed strategies to study more effectively — not just more hours.' },
                { icon: '🤝', t: 'Real Community', d: 'A motivated group of students from around the world who are serious about growth.' },
                { icon: '🎯', t: 'Accountability', d: 'Stay on track with your goals alongside people who understand what ambition looks like.' },
                { icon: '💡', t: 'Exclusive Content', d: 'First access to new resources, deep dives and content before anyone else.' },
              ].map((x, i) => (
                <SR key={i} delay={i * 70}>
                  <div className="bg-[#fff3d9] rounded-3xl p-8 h-full">
                    <div className="text-3xl mb-5">{x.icon}</div>
                    <h3 className="font-serif text-lg text-[#3b0918] mb-2">{x.t}</h3>
                    <p className="text-sm text-[#5a5a5a] leading-relaxed">{x.d}</p>
                  </div>
                </SR>
              ))}
            </div>
          </div>

              <a key={n} href={u} target="_blank" rel="noopener noreferrer" className="text-xs text-[#fff3d9]/25 hover:text-[#f60030] transition-colors">{n}</a>
            ))}
          </div>
        </div>
      </footer>
    );

    // ── APP ────────────────────────────────────────────────────
    function App() {
      const [page, setPage] = useState('home');
      const go = (p) => { setPage(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };

      const pages = { home: <Home go={go} />, about: <About />, community: <Community />, built: <Built />, cv: <CV />, opportunities: <Opps />, contact: <Contact /> };

      return (
        <>
          <Nav page={page} go={go} />
          {pages[page] || <Home go={go} />}
          <Footer go={go} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
