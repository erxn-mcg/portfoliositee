    // Scroll Reveal
    const ScrollReveal = ({ children, className = '', delay = 0 }) => {
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setTimeout(() => setIsVisible(true), delay); }, { threshold: 0.1 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, [delay]);
      return <div ref={ref} className={`transform transition-all duration-1000 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-12'} ${className}`}>{children}</div>;
    };

    // Animated Counter
    const AnimatedCounter = ({ end, suffix = '' }) => {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);
      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIsVisible(true); }, { threshold: 0.1 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);
      useEffect(() => {
        if (!isVisible) return;
        let start = 0;
        const timer = setInterval(() => { start += Math.ceil(end / 50); if (start >= end) { setCount(end); clearInterval(timer); } else { setCount(start); } }, 30);
        return () => clearInterval(timer);
      }, [isVisible, end]);
      return <span ref={ref}>{count.toLocaleString()}{suffix}</span>;
    };
