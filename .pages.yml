media:
  - name: images
    label: Note images
    input: uploads/notes
    output: /uploads/notes
    extensions: [jpg, jpeg, png, webp, gif]
    rename: random

content:
  - name: notes
    label: Writing
    type: file
    path: blog/notes.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Note address
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: Use lowercase words separated by hyphens, such as a-new-thought.
        description: Give each note a different address. Keep it unchanged after publishing so shared links still work.
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: topic
        label: Topic
        type: string
        required: true
        description: For example Curiosity, Education, Ambition, or Building. Topics appear automatically on the board.
      - name: kind
        label: Kind of writing
        type: select
        default: Note
        options:
          values: [Note, Essay, Reading note, Field note]
      - name: excerpt
        label: Short introduction
        type: text
        required: true
        options:
          maxlength: 400
        description: A sentence or two for the card on your Pinboard.
      - name: body
        label: Your note
        type: text
        required: true
        description: Write or paste your text here. Separate paragraphs with a blank line.
      - name: image
        label: Cover image
        type: image
        options:
          media: images
      - name: imageAlt
        label: Image description
        type: string
        description: Briefly describe the image for readers using a screen reader.

settings:
  commit:
    templates:
      update: 'Update writing via Pages CMS'
